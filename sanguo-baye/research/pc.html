<body style="height: auto;">
<div id="mode-switch">
    <a id="ms-m" href="index.html">手机版</a>
    <a href="index.html">设置</a>
</div>
<script>
    (function () {
        var name = window.localStorage['baye/libname'] || '';
        // m.html 有时效校验，必须带新鲜时间戳，否则会被弹回设置页
        document.getElementById('ms-m').href = 'm.html?name=' + name
            + '#' + new Date().getTime() / 1000;
    })();
</script>
<div layout="row center-center">
    <div class="container" style="width:480px">
        <div class="dummy"></div>
        <div class="element lcd">

        </div>
    </div>
</div>
<p></p>
<div layout="row center-center">
    <div style="width:480px">
        <div layout="row center-stretch">
            <div layout="column center-left" style="font-size:14px;line-height:140%">
                <div><h2>按键说明:</h2></div>
                <div>电脑键盘 -> 电子词典</div>
                <div>上下左右 -> 上下左右</div>
                <div>H键 -> 帮助</div>
                <div>S键 -> 查找</div>
                <div>回车键 -> 输入</div>
                <div>空格键 -> 返回</div>
            </div>
            <div layout="column center-left">
                <div style="color: red"><h2>扫一扫用手机玩</h2></div>
                <img src="qr.png" alt="" style="width: 8em;">
            </div>
        </div>
        <br>
        <br>
        <div id="save-backup" style="margin-top:8px">
            <button class="btn menu" type="button" onclick="location='save.html';">存档备份</button>
            <div style="font-size:13px;line-height:150%;margin-top:4px">
                把存档导出成文件或存档码，存到自己手里；也可以从文件或存档码导入。
                不需要登录，也不依赖任何服务器。
            </div>
        </div>
        <div id="lib-name"></div>
        <div id="lib-load"></div>
    </div>
</div>

<script>
    Module.postRun = function () {
        lcdInit();
        var libName = getLibName();
        $("#lib-name").html("当前版本: " + libName);
        bayeMain();
    }
    if (window.FileReader === undefined) {
        $("#lib-load").html('浏览器不支持载入Lib');
    } else {
        $("#lib-load").html('载入Lib: <input type="file" onchange="loadLib(this.files)">');
    }
    document.onkeydown = onKeyDown;

</script>
