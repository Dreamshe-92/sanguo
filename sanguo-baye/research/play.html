<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>正在进入游戏…</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.png">
<style>
    html, body {
        height: 100%;
        margin: 0;
    }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1b1d21;
        color: #e8e6e1;
        font: 16px/1.8 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
    }
    .box { max-width: 22em; }
    .tip { color: #9aa0a6; font-size: 14px; }
    a { color: #7fb3ff; }
    /* 模式选择（与伏魔记选择页同款卡片风格） */
    body.choose-mode {
        display: block;
        background: #f7f5f0;
        color: #1a1a1a;
        text-align: left;
        padding: 0;
    }
    main {
        width: 100%;
        max-width: 420px;
        margin: 0 auto;
        padding: 40px 20px;
        box-sizing: border-box;
    }
    h1 {
        font-size: 36px;
        text-align: center;
        letter-spacing: .4em;
        text-indent: .4em;
        font-family: "Kaiti SC", "STKaiti", "KaiTi", "SimSun", serif;
    }
    .choose-sub2 { text-align: center; color: #8a8577; font-size: 14px; margin-top: 10px; letter-spacing: .12em; }
    .opts { margin-top: 30px; display: flex; flex-direction: column; gap: 14px; }
    .opt {
        display: block;
        text-decoration: none;
        color: inherit;
        background: #fff;
        border: 1px solid #d8d2c4;
        border-radius: 12px;
        padding: 18px;
        position: relative;
        box-shadow: 0 1px 3px rgba(0,0,0,.05);
        transition: border-color .15s, box-shadow .15s;
        cursor: pointer;
    }
    .opt:active { transform: scale(.98); }
    @media (hover: hover) {
        .opt:hover { border-color: #1a1a1a; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    }
    .opt b { font-size: 19px; }
    .opt span { display: block; margin-top: 6px; font-size: 13px; color: #6f6a5c; line-height: 1.6; }
    .rec {
        display: none;
        position: absolute;
        top: 14px; right: 14px;
        font-size: 11px;
        font-style: normal;
        color: #fff;
        background: #a4342a;
        padding: 3px 8px;
        border-radius: 3px;
        letter-spacing: .1em;
    }
    .rec.on { display: block; }
    .choose-foot { margin-top: 26px; text-align: center; font-size: 12px; color: #a39d8d; line-height: 1.8; }
    .choose-foot a { color: #8a8577; }
    .spinner {
        display: inline-block;
        width: 1.1em;
        height: 1.1em;
        margin-right: .5em;
        vertical-align: -0.15em;
        border: 2px solid #3a3f45;
        border-top-color: #7fb3ff;
        border-radius: 50%;
        animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="box" id="msg">
    <div><span class="spinner"></span>正在进入游戏，请稍候…</div>
    <p class="tip">首次进入需要下载版本文件，之后会快很多。</p>
</div>
<main id="choose" hidden>
    <h1>三国霸业</h1>
    <p class="choose-sub2">选一种操作模式进入 · 游戏内右上角可随时切换</p>
    <nav class="opts">
        <a class="opt" data-page="m.html" data-mobile="1">
            <b>触屏版</b>
            <span>屏幕虚拟按键，横屏游玩，手机上还原电子词典手感。</span>
            <i class="rec" id="rec-touch">手机推荐</i>
        </a>
        <a class="opt" data-page="pc.html" data-mobile="">
            <b>键盘版</b>
            <span>电脑浏览器直玩：方向键移动，回车确认，空格返回。</span>
            <i class="rec" id="rec-key">电脑推荐</i>
        </a>
    </nav>
    <p class="choose-foot">手势 / 竖屏等更多模式在 <a href="index.html">设置页</a> 里选<br>存档都存在你自己的浏览器里，换模式不影响进度</p>
</main>

<script src="js/idbkvstore.min.js?ver=20260329"></script>
<script>
(function () {
    'use strict';

    var box = document.getElementById('msg');

    function fail(text) {
        box.innerHTML = '<div>' + text + '</div>'
            + '<p class="tip" style="margin-top:1.5em"><a href="choose.html">点这里手动选择版本</a></p>';
    }

    function getParam(name) {
        var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(window.location.search);
        if (!m) {
            return '';
        }
        var raw = m[1].replace(/\+/g, ' ');
        try {
            return decodeURIComponent(raw);
        } catch (e) {
            return raw;
        }
    }

    var libPath = getParam('lib');
    if (!libPath) {
        fail('没有指定要进入的版本。');
        return;
    }
    var libTitle = getParam('title') || libPath.split('/').pop().replace(/\.lib$/i, '');
    var fresh = getParam('fresh');

    // 站外独立入口（如黄豆豆版），直接跳转
    if (0 === libPath.indexOf('http')) {
        window.location.href = libPath;
        return;
    }

    // 换了版本，或站主标记过要更新，就丢掉旧缓存，否则沿用缓存直接进游戏
    var stale = window.localStorage['baye/libpath'] !== libPath
        || (fresh && window.localStorage['baye/playfresh'] !== fresh);

    var entered = false;
    function enter() {
        if (entered) {
            return;
        }
        entered = true;
        window.localStorage['baye/libname'] = libTitle;
        window.localStorage['baye/libpath'] = libPath;
        if (fresh) {
            window.localStorage['baye/playfresh'] = fresh;
        }

        // 不管是手机还是电脑，都先让玩家选模式（与伏魔记一致）
        document.body.className = 'choose-mode';
        box.style.display = 'none';
        document.getElementById('choose').hidden = false;
        var isMobile = navigator.userAgent.match(/(iPhone|iPod|Android|ios|Mobile|ARM)/i);
        document.getElementById(isMobile ? 'rec-touch' : 'rec-key').className = 'rec on';
    }

    Array.prototype.forEach.call(
        document.querySelectorAll('.opt'),
        function (opt) {
            opt.addEventListener('click', function (e) {
                e.preventDefault();
                var name = window.localStorage['baye/libname'] || 'Unnamed';
                var page = opt.getAttribute('data-page');
                var hash = opt.getAttribute('data-mobile') ? '#' + new Date().getTime() / 1000 : '';
                window.location.href = page + '?name=' + name + hash;
            });
        }
    );

    if (!stale) {
        enter();
        return;
    }

    if ('undefined' === typeof IdbKvStore) {
        fail('浏览器缓存清理没成功，先别急着重试。');
        return;
    }

    window.localStorage.removeItem('baye//data/dat.lib');
    window.localStorage.removeItem('baye/libname');
    window.localStorage.removeItem('baye/libpath');
    // 浏览器禁用本地数据库时回调不会回来，留一个兜底，别把玩家卡在这一页
    window.setTimeout(enter, 4000);
    new IdbKvStore('baye').remove('lib', enter);
})();
</script>
</body>
</html>
